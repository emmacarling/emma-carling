backend:
  name: github
  repo: emmacarling/emma-carling
  branch: main
  # Netlify is only used for the GitHub login (OAuth), not for hosting
  base_url: https://api.netlify.com
  site_domain: emmacarlingcms.netlify.app

# Edit content locally without logging in: run `npx decap-server` in the project
# folder, then open http://localhost:8080/admin/ (only used on localhost)
local_backend: true

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  # ---------- Products ----------
  - name: "shop"
    label: "Shop"
    files:
      - name: "products"
        label: "Products"
        file: "content/products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            label_singular: "product"
            summary: "{{fields.name}} – {{fields.price}} SEK"
            hint: "Drag to change the order. The first 8 are shown above the featured image, the rest below it."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price (SEK)", name: "price", widget: "number", value_type: "int", min: 0 }
              - { label: "Material", name: "material", widget: "text", required: false, hint: "Press Enter for a new line." }
              - label: "Sizes"
                name: "sizing"
                widget: "select"
                default: "two"
                options:
                  - { label: "Two sizes (Small / Medium and Large / X-Large)", value: "two" }
                  - { label: "One size", value: "one" }
              - label: "Colours"
                name: "colours"
                widget: "colour-picker"
                required: false
                hint: "The colours this product comes in. \"Special request\" is always shown too. The colours are set under Site settings → Colour options."
              - label: "Images"
                name: "images"
                widget: "list"
                label_singular: "image"
                hint: "The first image is shown in the grid. Drag to change the order."
                field: { label: "Image", name: "image", widget: "image" }

  # ---------- Everything else ----------
  - name: "settings"
    label: "Site settings"
    files:
      - name: "landing"
        label: "Landing page"
        file: "content/landing.json"
        fields:
          - label: "Desktop: image or video"
            name: "media"
            widget: "file"
            hint: "Fills the whole first screen. Also used on phones if there's no mobile version below. For video, use an .mp4 file (plays muted and on repeat), at most 1920 pixels wide and a few MB."
          - label: "Desktop: still image while the video loads"
            name: "poster"
            widget: "image"
            required: false
            hint: "Only used with a video. Also shown in low-power mode."
          - label: "Mobile: image or video (optional)"
            name: "media_mobile"
            widget: "file"
            required: false
            hint: "A tall (portrait) version for phones. Leave empty to use the desktop one on phones too."
          - label: "Mobile: still image while the video loads (optional)"
            name: "poster_mobile"
            widget: "image"
            required: false
            hint: "Only used with a mobile video. Leave empty to use the desktop still image."

      - name: "feature"
        label: "Feature slide (between the product grids)"
        file: "content/feature.json"
        fields:
          - label: "Slides"
            name: "slides"
            widget: "list"
            label_singular: "slide"
            required: false
            hint: "Images or .mp4 videos. They fade from one to the next in a loop. Drag to change the order. With one slide it just stays put; with none, the section is hidden."
            field: { label: "Image or video", name: "media", widget: "file" }
          - label: "Seconds per slide"
            name: "seconds"
            widget: "number"
            value_type: "float"
            min: 1
            default: 4
            required: false

      - name: "order-info"
        label: "Product page: How ordering works, Returns & Care"
        file: "content/order-info.json"
        fields:
          - label: "Info rows under the Order button"
            name: "sections"
            widget: "list"
            label_singular: "info row"
            collapsed: false
            summary: "{{fields.heading}}"
            hint: "Shown on every product page, under the Order button. Each row is a heading with a small menu icon; visitors click it to read the text. Drag to change the order, or add a new row at the bottom. A row without text is hidden on the site."
            fields:
              - { label: "Heading (the row's title)", name: "heading", widget: "string", hint: "e.g. How ordering works, Returns & refunds, Care" }
              - { label: "Text (shown when the row is opened)", name: "text", widget: "text", required: false, hint: "Empty lines start a new paragraph." }

      - name: "colours"
        label: "Colour options"
        file: "content/colours.json"
        fields:
          - label: "Colours"
            name: "colours"
            widget: "list"
            label_singular: "colour"
            summary: "{{fields.name}}"
            hint: "Shown in the order form. Tick which colours each product comes in under Shop → Products. \"Special request\" is always added at the end automatically. If you rename a colour, tick it again on the products that use it."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Colour", name: "color", widget: "color" }

      - name: "about"
        label: "Footer text"
        file: "content/about.json"
        fields:
          - { label: "Text about Emma", name: "text", widget: "text", hint: "Empty lines start a new paragraph." }

      - name: "contact"
        label: "Contact info"
        file: "content/contact.json"
        fields:
          - { label: "Email", name: "email", widget: "string", hint: "Also shown to customers if sending an order fails." }
          - { label: "Phone", name: "phone", widget: "string", required: false }
          - { label: "Instagram handle", name: "instagram", widget: "string", required: false, hint: "Without the @, e.g. emmacarling" }
