  <script>
    // GitHub Pages shows this page for any address that isn't a file, like
    // emmacarling.com/lova-dress. Product addresses are sent on to the shop,
    // which opens that product and shows the address again (see
    // openFromAddress in script.js).
    var slug = location.pathname.replace(/^\/+|\/+$/g, '');
    if (/^[a-z0-9-]+$/.test(slug)) location.replace('/?product=' + slug + location.hash);
