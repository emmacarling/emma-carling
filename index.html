<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Emma Carling</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LANDING -->
  <header class="landing">
    <!-- Image or video from content/landing.json -->
    <div class="landing-media"></div>
    <h1 class="landing-title"><img class="landing-logo" src="SVG/EmmaCarling.svg" alt="Emma Carling"></h1>
  </header>

  <!-- SHOP -->
  <main class="shop" id="shop">
    <p class="introtext">all items are made to order</p>

    <!-- Products from content/products.json: the first 8 here... -->
    <section class="product-grid" id="grid-top"></section>

    <!-- Image or video from content/feature.json -->
    <div class="feature" hidden></div>

    <!-- ...and the rest here -->
    <section class="product-grid" id="grid-bottom"></section>

  </main>

  <!-- CONTACT -->
  <footer class="contact">
    <div class="contact-intro"></div>

    <div class="contact-info">
      <p><a class="contact-email"></a></p>
      <p><a class="contact-phone"></a></p>
      <p><a class="contact-instagram" target="_blank" rel="noopener"></a></p>
    </div>
  </footer>

  <!-- PRODUCT OVERLAY (filled by script.js when a product is clicked) -->
  <div class="overlay" hidden>
    <button class="overlay-close" aria-label="Close"></button>
    <div class="overlay-info"></div>
    <div class="overlay-gallery">
      <div class="product-track overlay-track"></div>
      <div class="dots"></div>
      <button class="arrow prev" aria-label="Previous image"></button>
      <button class="arrow next" aria-label="Next image"></button>
    </div>
  </div>

  <!-- ORDER FORM (opened from the Order button in the product overlay) -->
  <div class="order-view" hidden>
    <button class="order-back" type="button">&larr; Back</button>

    <div class="order-left">
      <div class="order-summary">
        <div class="order-image"></div>
        <div class="order-summary-text">
          <p class="order-summary-name"></p>
          <p class="order-summary-price"></p>
        </div>
      </div>

      <!-- Text from content/order-info.json -->
      <div class="order-terms">
        <h3 class="terms-heading1"></h3>
        <p class="terms-text1"></p>

        <h3 class="terms-heading2"></h3>
        <p class="terms-text2"></p>
      </div>
    </div>

    <form class="order-form">
      <!-- Same title + price as the product view (desktop only; mobile shows them next to the thumbnail) -->
      <div class="order-product">
        <h2 class="product-title order-product-name"></h2>
        <p class="product-price order-product-price"></p>
      </div>

      <h3 class="order-heading">Order request</h3>

      <label class="field">
        <span>Full name</span>
        <input type="text" name="name" required autocomplete="name">
      </label>

      <label class="field">
        <span>Email</span>
        <input type="email" name="email" required autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false">
      </label>

      <label class="field">
        <span>Product</span>
        <input type="text" name="product" readonly>
      </label>

      <fieldset class="field">
        <legend>Size</legend>
        <div class="options size-options"></div>
      </fieldset>

      <fieldset class="field">
        <legend>Colour</legend>
        <div class="options colour-options">
          <label class="option swatch"><input type="radio" name="colour" value="Other (see message)" required><span><i class="rainbow"></i>Other</span></label>
        </div>
        <p class="field-hint other-hint" hidden>Please describe the colour you want in the message below.</p>
      </fieldset>

      <label class="field">
        <span>Message</span>
        <textarea name="message" rows="5" placeholder="Anything I should know? Measurements, questions, wishes…"></textarea>
      </label>

      <input type="hidden" name="price">

      <button class="order-button" type="submit">Send request</button>
      <p class="form-status" role="status"></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
