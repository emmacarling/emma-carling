<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Emma Carling</title>
  <!-- Colours the phone's status bar strip like the top of the landing video
       (keep in sync with --landing-top in style.css) -->
  <meta name="theme-color" content="#59575b">
  <!-- Icon in the browser tab, on phone home screens and in bookmarks: the E monogram (SVG/EC-Icon.svg) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Preview when the link is shared (Instagram, iMessage, WhatsApp…) -->
  <meta name="description" content="Emma Carling is an independent slow fashion brand. Every piece is draped with zero waste techniques and handcrafted in her atelier in Stockholm.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Emma Carling">
  <meta property="og:title" content="Emma Carling">
  <meta property="og:description" content="Emma Carling is an independent slow fashion brand. Every piece is draped with zero waste techniques and handcrafted in her atelier in Stockholm.">
  <meta property="og:url" content="https://emmacarling.com/">
  <meta property="og:image" content="https://emmacarling.com/images/share-icon.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://emmacarling.com/">
  <!-- Tells search engines who the brand is -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Emma Carling",
    "url": "https://emmacarling.com/",
    "logo": "https://emmacarling.com/icon-512.png",
    "description": "Independent slow fashion brand. Every piece is draped with zero waste techniques and handcrafted in an atelier in Stockholm.",
    "sameAs": ["https://www.instagram.com/emmacarling1/"]
  }
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- LANDING -->
  <header class="landing">
    <!-- Image or video from content/landing.json -->
    <div class="landing-media"></div>
    <h1 class="landing-title"><img class="landing-logo" src="/SVG/EC-Logo-Yellow.svg" alt="Emma Carling"></h1>
  </header>

  <!-- SHOP -->
  <main class="shop" id="shop">

    <!-- Products from content/products.json: the first 8 here... -->
    <section class="product-grid" id="grid-top"></section>

    <!-- Image or video from content/feature.json -->
    <div class="feature" hidden></div>

    <!-- ...and the rest here -->
    <section class="product-grid" id="grid-bottom"></section>

  </main>

  <!-- CONTACT -->
  <footer class="contact">
    <div class="contact-intro"></div>

    <div class="contact-info">
      <p><a class="contact-email"></a></p>
      <p><a class="contact-phone"></a></p>
      <p><a class="contact-instagram" target="_blank" rel="noopener"></a></p>
    </div>
  </footer>

  <!-- PRODUCT VIEW (filled by script.js when a product is opened).
       Each product has its own address, e.g. emmacarling.com/lova-dress -->
  <div class="overlay" hidden>
    <button class="overlay-close" type="button" aria-label="Close"><span class="x" aria-hidden="true">X</span> Close</button>

    <!-- Small preview images: left of the big image (under it on mobile).
         Click one to show it; the one in view gets a black outline. -->
    <div class="thumbs"></div>

    <div class="overlay-gallery">
      <div class="product-track overlay-track"></div>
      <button class="arrow prev" type="button" aria-label="Previous image"></button>
      <button class="arrow next" type="button" aria-label="Next image"></button>
    </div>

    <!-- Product details. The Order button unfolds the order form right here. -->
    <form class="overlay-info order-form">
      <h2 class="product-title"></h2>
      <p class="product-price"></p>
      <p class="product-material"></p>

      <!-- Folded away until Order is pressed -->
      <div class="fold order-fields" inert>
        <div class="fold-inner">
          <h3 class="order-heading">Fill in order request</h3>

          <label class="field">
            <span>Full name</span>
            <input type="text" name="name" required autocomplete="name">
          </label>

          <label class="field">
            <span>Email</span>
            <input type="email" name="email" required autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false">
          </label>

          <fieldset class="field">
            <legend>Size</legend>
            <div class="options size-options"></div>
          </fieldset>

          <fieldset class="field">
            <legend>Colour</legend>
            <div class="options colour-options">
              <label class="option swatch"><input type="radio" name="colour" value="Special request (see message)" required><span><i class="rainbow"></i>Request</span></label>
            </div>
            <p class="field-hint other-hint" hidden>Please describe the colour you want in the message below.</p>
          </fieldset>

          <label class="field">
            <span>Message</span>
            <textarea name="message" rows="5" placeholder="Anything I should know? Measurements, questions, wishes…"></textarea>
          </label>

          <input type="hidden" name="product">
          <input type="hidden" name="price">
        </div>
      </div>

      <button class="order-button" type="submit">Order</button>
      <p class="form-status" role="status"></p>

      <!-- Shipping, returns, care… (content/order-info.json) -->
      <div class="info-menu"></div>
    </form>
  </div>

  <script src="/script.js"></script>
</body>
</html>
